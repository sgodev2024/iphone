name: CI CD Viet Dev

on:
  push:
    branches:
      - viet_dev

  workflow_dispatch:

concurrency:
  group: ci-cd-viet-dev
  cancel-in-progress: false

jobs:

  # ==================================
  # CI - TEST CODE TRƯỚC KHI DEPLOY
  # ==================================
  ci:
    name: CI - Test and Build
    runs-on: ubuntu-latest

    # MySQL tạm thời dành riêng cho CI
    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ci_migration

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # 1. Lấy source code
      - name: Checkout source code
        uses: actions/checkout@v4


      # 2. Cài PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, pdo_mysql, pdo_sqlite
          coverage: none


      # 3. Tạo .env cho CI
      - name: Create CI environment
        run: |
          cp .env.example .env


      # 4. Cài Composer
      - name: Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader


      # 5. Tạo APP_KEY
      - name: Generate Laravel key
        run: |
          php artisan key:generate


      # 6. Chạy migration trên MySQL tạm
      - name: Run database migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ci_migration
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --force

      - name: Verify CI database schema
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ci_migration
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          echo "===== MIGRATION STATUS ====="
          php artisan migrate:status

          echo "===== CHECK transactions.branch_id ====="
          php artisan tinker --execute="dump(\Illuminate\Support\Facades\Schema::hasColumn('transactions', 'branch_id'));"


      # 7. Chạy Laravel test
      - name: Run Laravel tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          php artisan test --stop-on-failure --stop-on-error


      # 8. Cài Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # 9. Cài frontend dependencies
      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # 10. Build frontend
      - name: Build frontend
        run: |
          npm run build



  # ==================================
  # CD - CHỈ CHẠY KHI CI THÀNH CÔNG
  # ==================================
  deploy:
    name: CD - Deploy to Server
    runs-on: ubuntu-latest

    needs: ci

    steps:

      # 1. Chuẩn bị SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s' "${{ secrets.PROD_SSH_KEY_B64 }}" \
            | base64 --decode \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          ssh-keyscan \
            -p "${{ secrets.PROD_PORT }}" \
            -H "${{ secrets.PROD_HOST }}" \
            >> ~/.ssh/known_hosts


      # 2. Deploy lên server
      - name: Deploy Laravel
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.PROD_PORT }}" \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "DEPLOY_SHA='${{ github.sha }}' bash -s" << 'EOF'

            set -e

            cd /usr/share/nginx/html/demo_aicrm

            echo "===== UPDATE SOURCE ====="

            git fetch origin viet_dev
            git reset --hard "$DEPLOY_SHA"


            echo "===== COMPOSER ====="

            composer install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader


            echo "===== FRONTEND ====="

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            npm run build


            echo "===== LARAVEL ====="

            php artisan optimize:clear
            php artisan optimize

            php artisan queue:restart || true


            echo "===== DEPLOY SUCCESS ====="

          EOF